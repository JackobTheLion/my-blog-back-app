plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    constraints {
        api 'org.mapstruct:mapstruct:1.6.3'
        api 'org.mapstruct:mapstruct-processor:1.6.3'
        api 'org.testcontainers:testcontainers-postgresql:2.0.5'
        api 'org.apache.tika:tika-core:3.3.2'
    }
}
